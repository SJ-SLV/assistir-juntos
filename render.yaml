services:
  - type: web
    name: assistir-juntos
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: METERED_TURN_USERNAME
        sync: false
      - key: METERED_TURN_CREDENTIAL
        sync: false
